<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PGEV Phase 2 document reference library"><title>PGEV Phase 2 | Document Library</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2c40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#153a59;color:white;padding:34px max(20px,calc((100vw - 940px)/2))}header h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}header p{margin:0;color:#dbe9f3}main{max-width:940px;margin:28px auto;padding:0 18px}.search{width:100%;border:1px solid #c5d1dc;border-radius:12px;padding:15px;font-size:16px;margin-bottom:22px}.group{background:white;border:1px solid #e0e7ed;border-radius:14px;margin:0 0 18px;padding:18px 20px;box-shadow:0 2px 9px #122f4b0a}.group h2{font-size:19px;margin:0 0 12px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #edf0f4;padding:13px 0}.item a{color:#07558b;text-decoration:none;font-weight:650}.item a:hover{text-decoration:underline}.item small{display:block;color:#627285;margin-top:5px}.tag{font-size:12px;background:#e8f3fc;border-radius:6px;padding:5px 8px;white-space:nowrap;color:#245d7d}footer{max-width:940px;margin:20px auto 40px;padding:0 18px;color:#637183;font-size:13px}.hidden{display:none}@media(max-width:500px){.item{align-items:flex-start}.tag{font-size:11px}}
</style></head><body><header><h1>PGEV Phase 2 Document Library</h1><p>Homeowners' reference archive · PDF documents and regulations</p></header><main><input class="search" id="search" type="search" placeholder="Search documents, topics, or sections…" aria-label="Search documents"><div id="library"></div><p id="empty" class="hidden">No matching documents found.</p></main><footer>Reference documents only. Please consult the issuing agency for current official records. This is not an official DHSUD website.</footer><script>
const groups=[{title:'DHSUD Regulations',items:[['2024 Revised IRR of RA 9904','57-page Department Circular No. 2024-018','pdfs/2024-revised-irr.pdf'],
['Rule VI — Segregation','Sections 38–40 · begins on PDF page 24','pdfs/2024-revised-irr.pdf#page=24'],
['Rule VII — Merger and Consolidation','Sections 41–45 · begins on PDF page 25','pdfs/2024-revised-irr.pdf#page=25'],
['Election and Failure of Election','Sections 87–95 · begins around PDF page 47','pdfs/2024-revised-irr.pdf#page=47']]},
{title:'HOA Corporate Documents',items:[['Articles of Incorporation','Parkwood Greens Executive Village HOA','pdfs/articles-incorporation.pdf'],
['Amended Articles and By-Laws','Corporate documents and amended by-laws','pdfs/Bylaws Regular v2024DHSUD.pdf']]},
{title:'Election and Ethics',items:[['Code of Ethics and Ethical Standards','DHSUD Form','pdfs/Code of Ethics and Ethical Standards for Officers and Members of the Board of Directors - 2026.pdf'],['Election Form','DHSUD Requirements','pdfs/Documentary Requirements - Election Reports.pdf']]},
{title:'Phase 2 Reference Documents',items:[['Phase 2 Subdivision Map','Subdivision layout and lot references','pdfs/phase2-map.pdf'],

['Phase 2 LGU Deed of Donations','Resolution 131-11, Sgd','pdfs/DOD_Res131-11.pdf'],

['DHSUD Annual Requirements','Annual Report Requirements','pdfs/Documentary Requirements - Annual Reports.pdf']]}];
const library=document.getElementById('library');function render(q=''){library.replaceChildren();let total=0;for(const g of groups){const matches=g.items.filter(i=>(g.title+' '+i[0]+' '+i[1]).toLowerCase().includes(q.toLowerCase().trim()));if(!matches.length)continue;total+=matches.length;const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=g.title;section.append(heading);for(const [title,desc,url] of matches){const item=document.createElement('div');item.className='item';const left=document.createElement('div');const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='📄 '+title;const small=document.createElement('small');small.textContent=desc;left.append(a,small);const tag=document.createElement('span');tag.className='tag';tag.textContent='Open PDF ↗';item.append(left,tag);section.append(item)}library.append(section)}document.getElementById('empty').classList.toggle('hidden',total!==0)}document.getElementById('search').addEventListener('input',e=>render(e.target.value));render();
</script></body></html>
